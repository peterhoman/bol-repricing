name: Bol.com Repricing

on:
  schedule:
    # Tijden in UTC (GitHub kent geen zomer/wintertijd). De labels erachter
    # zijn de Amsterdamse tijd: elke run 5 min na het einde van een
    # Channable-importslot. WINTERTIJD (UTC+1) sinds 26 okt 2026: alle uren
    # +1 t.o.v. de zomerstand. Bij de ZOMERTIJD (zo 28 maart 2027) alle uren
    # weer 1 terug, anders lopen de runs een uur achter op Channable.
    # Matches Channable's 24 daily import slots (07:45-21:15 Amsterdam time,
    # skipping the night when nobody buys anyway), each run ~5 min after its
    # matching Channable slot so fresh prices are ready before the NEXT slot.
    # (Vroegere NOTE hier zei "in de herfst -1 uur": dat was verkeerd om.
    # Amsterdam = UTC + offset; winter offset 1, zomer 2. Dus winter: UTC-uur
    # = label - 1; zomer: UTC-uur = label - 2. Gecorrigeerd 26 okt 2026.)
    - cron: '5 7 * * *'    # 08:05 Amsterdam
    - cron: '35 7 * * *'   # 08:35
    - cron: '5 8 * * *'    # 09:05
    - cron: '35 8 * * *'   # 09:35
    - cron: '5 9 * * *'    # 10:05
    - cron: '35 9 * * *'   # 10:35
    - cron: '5 10 * * *'    # 11:05
    - cron: '35 10 * * *'   # 11:35
    - cron: '5 11 * * *'   # 12:05
    - cron: '35 11 * * *'  # 12:35
    - cron: '5 12 * * *'   # 13:05
    - cron: '35 12 * * *'  # 13:35
    - cron: '5 13 * * *'   # 14:05
    - cron: '5 14 * * *'   # 15:05
    - cron: '35 14 * * *'  # 15:35
    - cron: '5 15 * * *'   # 16:05
    - cron: '5 16 * * *'   # 17:05
    - cron: '35 16 * * *'  # 17:35
    - cron: '35 17 * * *'  # 18:35
    - cron: '5 18 * * *'   # 19:05
    - cron: '35 18 * * *'  # 19:35
    - cron: '20 19 * * *'  # 20:20
    - cron: '50 19 * * *'  # 20:50
    - cron: '20 20 * * *'  # 21:20
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reprice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run repricing iteration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: peterhoman/bol-repricing
        run: python src/github_action_reprice.py
